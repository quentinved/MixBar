name: Site

# The landing page in site/ is plain static files, so this only runs when they
# change. Cloudflare deploys the site from its own Git integration and does not
# wait for this check — so `check` reports that a push broke the page, it does
# not stop it. The gate is branch protection requiring this check on pull
# requests, so nothing broken reaches main to be deployed in the first place.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/check-site.sh"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "tools/check-site.sh"
      - ".github/workflows/site.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The page has no build step, so nothing else would catch a missing asset,
      # a dead link, or markup the CSP drops on the floor.
      - name: Check site
        run: ./tools/check-site.sh
