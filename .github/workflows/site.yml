name: Site

# The landing page in site/ is plain static files, so this only runs when they
# change. Cloudflare Pages deploys the site from its own Git integration, which
# does not wait for this check — so `check` is what tells you a push broke the
# page, not what stops it. The deploy job stays as a fallback and skips entirely
# unless the repository variable CLOUDFLARE_PROJECT is set.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/check-site.sh"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "tools/check-site.sh"
      - ".github/workflows/site.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The page has no build step, so nothing else would catch a missing asset,
      # a dead link, or markup the CSP drops on the floor.
      - name: Check site
        run: ./tools/check-site.sh

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && vars.CLOUDFLARE_PROJECT != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PROJECT }}
