name: Release

# Tag a version to publish it:  git tag v0.2 && git push origin v0.2
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: tools/select-xcode.sh

      # The artifacts and the cask take their version from Info.plist; the
      # release takes its name from the tag. Nothing connects the two, so a tag
      # that disagrees ships MixBar-<old>.dmg under v<new>, and a cask whose
      # download URL is a 404 for every user who runs brew install.
      - name: Check the tag against the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(plutil -extract CFBundleShortVersionString raw app/Info.plist)"
          if [ "$TAG" != "$VERSION" ]; then
              echo "tag $GITHUB_REF_NAME, but app/Info.plist says $VERSION" >&2
              echo "bump CFBundleShortVersionString to $TAG, commit, then retag" >&2
              exit 1
          fi
          echo "releasing $VERSION"

      - name: Run tests
        working-directory: app
        run: swift test

      # A signing identity is a certificate plus its private key. Both travel
      # together in the .p12. It goes into a throwaway keychain so it never
      # touches the runner's login keychain, and the runner is destroyed after
      # the job regardless.
      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a GUI prompt that no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain

          rm -f "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application"

      - name: Write notarization key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo -n "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"

      - name: Build, sign, notarize and staple
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          tools/release.sh

      # Fail the release here rather than letting a build that Gatekeeper will
      # reject reach the releases page.
      - name: Verify Gatekeeper acceptance
        run: |
          set -euo pipefail
          for ARTIFACT in build/MixBar-*.dmg build/MixBar-*.pkg; do
              [ -f "$ARTIFACT" ] || continue
              echo "checking $ARTIFACT"
              xcrun stapler validate "$ARTIFACT"
          done

      - name: Clean up secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/certificate.p12"

      # The .pkg is only produced when a Developer ID Installer certificate is
      # available, so an unmatched glob must not fail the release.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/MixBar-*.dmg
            build/MixBar-*.pkg
          fail_on_unmatched_files: false
          generate_release_notes: true

      # The checksum changes once the DMG is signed and stapled, so the cask
      # must be updated from the built artifact, never from an earlier build.
      - name: Homebrew cask (copy into your tap)
        run: |
          echo "::group::mixbar.rb"
          cat build/mixbar.rb
          echo "::endgroup::"
