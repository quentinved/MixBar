name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: tools/select-xcode.sh

      # The core imports no frameworks and every port has a fake, so the whole
      # rule set runs on a CI box with no audio device and no permissions.
      - name: Run tests
        working-directory: app
        run: swift test

      - name: Build
        working-directory: app
        run: swift build -c release
