name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The newest Xcode on the image builds against an SDK newer than the
      # runner's macOS, and the test bundle then fails to dlopen: the CoreAudio
      # overlay it links resolves against /usr/lib/swift, which is the older OS
      # copy. Take the newest Xcode whose SDK is not ahead of the OS instead.
      - name: Select Xcode
        run: |
          set -euo pipefail
          OS_MAJOR="$(sw_vers -productVersion | cut -d. -f1)"
          for CANDIDATE in $(ls -d /Applications/Xcode*.app | sort -Vr); do
              SDK="$(DEVELOPER_DIR="$CANDIDATE/Contents/Developer" \
                  xcrun --sdk macosx --show-sdk-version 2>/dev/null)" || continue
              if [ "${SDK%%.*}" -le "$OS_MAJOR" ]; then XCODE="$CANDIDATE"; break; fi
          done
          [ -n "${XCODE:-}" ] || { echo "no Xcode with an SDK <= macOS $OS_MAJOR" >&2; exit 1; }
          echo "macOS $OS_MAJOR, using $XCODE (SDK $SDK)"
          sudo xcode-select -s "$XCODE"
          swift --version

      # The core imports no frameworks and every port has a fake, so the whole
      # rule set runs on a CI box with no audio device and no permissions.
      - name: Run tests
        working-directory: app
        run: swift test

      - name: Build
        working-directory: app
        run: swift build -c release
