name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: tools/select-xcode.sh

      # The core imports no frameworks and every port has a fake, so the whole
      # rule set runs on a CI box with no audio device and no permissions.
      - name: Run tests
        working-directory: app
        run: swift test

      - name: Build
        working-directory: app
        run: swift build -c release

  # Separate, and on Linux: this needs no Xcode and no macOS runner, and a dead
  # link should not wait behind a ten-minute build to be reported.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check documentation links
        run: tools/check-links.sh
